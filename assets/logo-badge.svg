<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft circular background gradient matching card back -->
    <radialGradient id="badgeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAF6FA" />
      <stop offset="60%" stop-color="#CBE8F3" />
      <stop offset="100%" stop-color="#A5DBEC" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Outer Shadow & White Border Circle -->
  <g filter="url(#shadow)">
    <circle cx="200" cy="200" r="185" fill="url(#badgeBg)" stroke="#FFFFFF" stroke-width="12" />
  </g>

  <!-- Main Logo Group -->
  <g transform="translate(45, 45)">
    <!-- Broom Handle + Top Swoop of 'A' -->
    <!-- Broom stick sweeping from left into the loop of A -->
    <path d="M 65 140 Q 110 50 145 65 Q 165 75 145 105 L 125 150 Q 115 175 135 175 Q 150 175 160 150" 
          fill="none" stroke="#1B4D68" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Broom Bristles at handle tip (sweeping icon) -->
    <g transform="translate(50, 130) rotate(-45)">
      <path d="M 0 0 L -18 -10 L -22 10 L 0 0" fill="#1B4D68" />
      <line x1="-18" y1="-5" x2="-26" y2="-8" stroke="#1B4D68" stroke-width="2" stroke-linecap="round"/>
      <line x1="-20" y1="0" x2="-28" y2="0" stroke="#1B4D68" stroke-width="2" stroke-linecap="round"/>
      <line x1="-18" y1="5" x2="-26" y2="8" stroke="#1B4D68" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Crossbar of 'A' -->
    <path d="M 100 135 Q 130 130 155 135" fill="none" stroke="#1B4D68" stroke-width="7" stroke-linecap="round" />

    <!-- Ampersand '&' -->
    <text x="148" y="125" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#1B4D68" font-style="italic">&amp;</text>

    <!-- Script 'W' in Green -->
    <path d="M 155 125 Q 165 95 180 95 Q 195 95 185 140 Q 180 165 195 165 Q 210 165 215 110 Q 220 95 235 95 Q 245 95 235 140 Q 230 165 245 165 Q 260 165 270 120" 
          fill="none" stroke="#4CAF50" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Soap Bubbles floating around W -->
    <g fill="none" stroke="#4CAF50" stroke-width="3">
      <!-- Bubble 1 -->
      <circle cx="255" cy="180" r="14" />
      <circle cx="252" cy="177" r="3" fill="#FFFFFF" fill-opacity="0.8" stroke="none" />
      <!-- Bubble 2 -->
      <circle cx="280" cy="165" r="9" />
      <circle cx="278" cy="163" r="2" fill="#FFFFFF" fill-opacity="0.8" stroke="none" />
      <!-- Bubble 3 -->
      <circle cx="240" cy="200" r="7" />
      <!-- Bubble 4 -->
      <circle cx="270" cy="198" r="5" />
    </g>

    <!-- Text "CLEANING" in Dark Cyan Caps -->
    <text x="155" y="240" font-family="'Outfit', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#1B4D68" text-anchor="middle" letter-spacing="3">CLEANING</text>
    
    <!-- Text "SERVICES" in Green Caps -->
    <text x="155" y="268" font-family="'Outfit', 'Arial Black', sans-serif" font-size="22" font-weight="800" fill="#4CAF50" text-anchor="middle" letter-spacing="5">SERVICES</text>
  </g>
</svg>
