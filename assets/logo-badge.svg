<svg width="380" height="380" viewBox="10 10 380 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radial Cyan Gradient matching the circular badge on the back of the business card -->
    <radialGradient id="badgeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EFF8FC" />
      <stop offset="65%" stop-color="#CBE8F3" />
      <stop offset="100%" stop-color="#9AD5EA" />
    </radialGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="tealGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A9396" />
      <stop offset="100%" stop-color="#005F73" />
    </linearGradient>
    <linearGradient id="greenGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CBD3A" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
  </defs>

  <!-- Outer Circle with White Frame -->
  <g filter="url(#badgeShadow)">
    <circle cx="200" cy="200" r="180" fill="url(#badgeBg)" stroke="#FFFFFF" stroke-width="12" />
  </g>

  <!-- Logo Artwork centered inside badge -->
  <g transform="translate(40, 35)">
    <!-- Broom Handle & Top Swoop of 'A' -->
    <path d="M 50 145 Q 95 45 145 60 Q 170 70 148 105 L 125 155 Q 115 180 138 180 Q 155 180 165 150" 
          fill="none" stroke="url(#tealGradB)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Broom Head -->
    <g transform="translate(48, 142) rotate(-45)">
      <path d="M 0 0 L -22 -12 Q -25 0 -22 12 Z" fill="#005F73" />
      <line x1="-16" y1="-7" x2="-26" y2="-10" stroke="#E9D8A6" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-18" y1="0" x2="-28" y2="0" stroke="#EE9B00" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-16" y1="7" x2="-26" y2="10" stroke="#E9D8A6" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Crossbar of 'A' -->
    <path d="M 95 138 Q 130 132 160 138" fill="none" stroke="url(#tealGradB)" stroke-width="7.5" stroke-linecap="round" />

    <!-- Ampersand '&' -->
    <text x="150" y="128" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="30" font-weight="900" fill="#005F73" font-style="italic">&amp;</text>

    <!-- Script 'W' in Green -->
    <path d="M 160 128 Q 172 92 188 92 Q 204 92 192 145 Q 186 172 204 172 Q 220 172 226 112 Q 232 92 248 92 Q 260 92 248 145 Q 242 172 260 172 Q 276 172 286 122" 
          fill="none" stroke="url(#greenGradB)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Water / Soap Bubbles -->
    <g fill="none" stroke="#5CBD3A" stroke-width="3">
      <circle cx="270" cy="188" r="15" stroke="#388E3C" stroke-width="3.5"/>
      <circle cx="266" cy="184" r="3.5" fill="#FFFFFF" fill-opacity="0.9" stroke="none" />
      <circle cx="296" cy="172" r="10" stroke="#5CBD3A" stroke-width="2.5"/>
      <circle cx="294" cy="170" r="2.5" fill="#FFFFFF" fill-opacity="0.9" stroke="none" />
      <circle cx="252" cy="210" r="8" stroke="#388E3C" stroke-width="2"/>
      <circle cx="285" cy="208" r="6" stroke="#5CBD3A" stroke-width="2"/>
      <circle cx="308" cy="192" r="4.5" stroke="#388E3C" stroke-width="1.5"/>
    </g>

    <!-- Text "CLEANING" -->
    <text x="160" y="238" font-family="'Outfit', 'Arial Black', sans-serif" font-size="35" font-weight="900" fill="#005F73" text-anchor="middle" letter-spacing="4">CLEANING</text>
    
    <!-- Text "SERVICES" -->
    <text x="160" y="265" font-family="'Outfit', 'Arial Black', sans-serif" font-size="22" font-weight="800" fill="#388E3C" text-anchor="middle" letter-spacing="6">SERVICES</text>
  </g>
</svg>
