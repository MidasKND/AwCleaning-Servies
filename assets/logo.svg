<svg width="300" height="150" viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2A7F85;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6CC24A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle (Optional, stylistic) -->
  <circle cx="150" cy="75" r="70" stroke="url(#grad1)" stroke-width="4" fill="white" fill-opacity="0.9" />
  
  <!-- "A" -->
  <text x="80" y="100" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#2A7F85">A</text>
  
  <!-- "&" -->
  <text x="135" y="100" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#6CC24A">&amp;</text>
  
  <!-- "W" -->
  <text x="170" y="100" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#2A7F85">W</text>
  
  <!-- Subtitle -->
  <text x="150" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2A7F85" text-anchor="middle" letter-spacing="2">CLEANING SERVICES</text>
  
  <!-- Broom Icon / Swoosh -->
  <path d="M 60 110 Q 150 145 240 110" stroke="#6CC24A" stroke-width="5" fill="none" />
</svg>
